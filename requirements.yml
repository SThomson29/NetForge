---
# Ansible Galaxy requirements for NetForge
# Install with: ansible-galaxy install -r requirements.yml
#
# Pinned rather than floated — these playbooks talk to live switches, so the
# runtime should be reproducible. NetForgeUI installs the same version in its
# image (see its Dockerfile); keep the two in step.

collections:
  # Required by the deploy and firmware playbooks.
  #   aoscx_config / aoscx_command  — SSH/CLI modules
  #   aoscx_upload_firmware / aoscx_boot_firmware — REST modules (need pyaoscx)
  - name: arubanetworks.aoscx
    version: "4.5.1"
